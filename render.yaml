services:
  - type: web
    name: mernapp-backend
    runtime: node
    repo: https://github.com/your-username/your-repo
    plan: free
    region: oregon
    branch: main
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://your-frontend-url.onrender.com
      - key: PORT
        value: 10000
